
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свято-Юрьев монастырь</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="frame-page monastyr-page">

  <!-- Десктопная версия -->
  <main class="frame-container monastyr-desktop">
    <a href="../index.html#route" class="back-to-route">
      ← НАЗАД К МАРШРУТУ
    </a>

    <img
      class="frame-image"
      src="../images/monastyr.png"
      alt="Свято-Юрьев монастырь"
    >

    <button class="audio-button" id="audioButton" type="button"
      aria-label="Слушать аудио">
      <img src="../images/knopka.png" alt="">
    </button>
  </main>

  <!-- Мобильная версия -->
  <main class="monastyr-mobile">
    <img
      class="monastyr-mobile-poster"
      src="../images/monastyr-mob.png"
      alt="Свято-Юрьев монастырь в Великом Новгороде"
    >

    <div class="monastyr-mobile-controls">
      <button
        class="monastyr-mobile-audio"
        id="mobileAudioButton"
        type="button"
      >
        <img src="../images/knopka.png" alt="">
        <span id="mobileAudioLabel">СЛУШАТЬ АУДИО</span>
      </button>

      <a href="../index.html#route" class="monastyr-mobile-back">
        ← НАЗАД К МАРШРУТУ
      </a>
    </div>
  </main>

  <!-- Общий аудиофайл -->
  <audio id="placeAudio" preload="none">
    <source src="../audio/monastyr.mp3" type="audio/mpeg">
  </audio>

  <script>
    const placeAudio = document.getElementById("placeAudio");
    const audioButton = document.getElementById("audioButton");
    const mobileAudioButton =
      document.getElementById("mobileAudioButton");
    const mobileAudioLabel =
      document.getElementById("mobileAudioLabel");

    async function toggleAudio() {
      if (placeAudio.paused) {
        try {
          await placeAudio.play();
        } catch (error) {
          console.error("Не удалось воспроизвести аудио:", error);
        }
      } else {
        placeAudio.pause();
      }
    }

    audioButton.addEventListener("click", toggleAudio);
    mobileAudioButton.addEventListener("click", toggleAudio);

    function updateAudioButtons() {
      const playing = !placeAudio.paused;

      audioButton.classList.toggle("is-playing", playing);
      mobileAudioButton.classList.toggle("is-playing", playing);

      mobileAudioLabel.textContent =
        playing ? "ПАУЗА" : "СЛУШАТЬ АУДИО";
    }

    placeAudio.addEventListener("play", updateAudioButtons);
    placeAudio.addEventListener("pause", updateAudioButtons);
    placeAudio.addEventListener("ended", updateAudioButtons);
  </script>

</body>
</html>
